name: bolognanerd

networks:
  bolognanerd_network:
    external: true
    name: bolognanerd_bolognanerd_network

volumes:
  bolognanerd_nas_data_nfs:
    external: true

services:
  my-media-collection:
    build: .
    image: my-media-collection:latest
    container_name: my-media-collection
    restart: unless-stopped
    networks:
      - bolognanerd_network
    # Config runtime centralizzata in .env.
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      # Mount del workspace per sviluppo rapido e modifiche live nel container.
      - ./:/app
      # Licenza FileBot host -> container. Il path host arriva da FILEBOT_LICENSE_DIR.
      - type: bind
        source: ${FILEBOT_LICENSE_DIR}
        target: /licenses
        read_only: true
      # Dati applicativi persistenti: cache, export e file runtime MMC.
      - type: volume
        source: bolognanerd_nas_data_nfs
        target: /data
        volume:
          subpath: Configurazioni/my-media-collection/data
      # Upload persistenti condivisi via volume NFS.
      - type: volume
        source: bolognanerd_nas_data_nfs
        target: /uploads
        volume:
          subpath: Configurazioni/my-media-collection/uploads
    # Un solo worker: refresh/job state vive in memoria processo e non e condiviso tra worker Gunicorn.
    # I thread restano sufficienti per UI + job background senza falsi "refresh finito".
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "--timeout", "180", "main:app"]
