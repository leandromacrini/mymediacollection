name: bolognanerd

networks:
  bolognanerd_network:
    external: true
    name: bolognanerd_bolognanerd_network

services:
  my-media-collection:
    build: .
    image: my-media-collection:latest
    container_name: my-media-collection
    restart: unless-stopped
    networks:
      - bolognanerd_network
    # Config runtime centralizzata in .env.
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      # Licenza FileBot persistente sul NAS OMV.
      - type: bind
        source: ${OMV_NAS_ROOT}/Configurazioni/my-media-collection/licenses
        target: /licenses
        read_only: true
      # Dati applicativi persistenti: cache, export e file runtime MMC.
      - type: bind
        source: ${OMV_NAS_ROOT}/Configurazioni/my-media-collection/data
        target: /data
      # Upload persistenti MMC.
      - type: bind
        source: ${OMV_NAS_ROOT}/Configurazioni/my-media-collection/uploads
        target: /uploads
    # Un solo worker: refresh/job state vive in memoria processo e non e condiviso tra worker Gunicorn.
    # I thread restano sufficienti per UI + job background senza falsi "refresh finito".
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "--timeout", "180", "main:app"]
